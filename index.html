<!-- tampilan utama -->
    <main class="tampilan_utama">
    <nav class="navbar bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand"><h2>Daftar Siswa</h2></a>
    <form class="d-flex" role="search">
      <input class="form-control me-2" type="search" id="search" placeholder="Search" aria-label="Search"/>
      <button class="btn btn-outline-success" type="submit">Search</button>
    </form>
  </div>
</nav>
<div class="kontainer_namasiswa">
    <table>
      <thead>
        <tr class="judultable">
            <td id="noUrut" class="judultable">NO.</td>
            <td id="namaSiswa" class="namaSiswa,judultab">NAMA</td>
            <td id="kelas" class="judultable" >KELAS</td>
            <td id="score" class="judultable">NILAI (SCORE)</td>
        </tr>
      </thead>
      <tbody id="kontainerData">

      </tbody>
    </table>
    <footer>
      <div id="nilaiRata2"></div>
    </footer>
</div>
</main>
<!-- java script -->
 <script>
    const kontainerData = document.getElementById("kontainerData");
    const noUrut = document.getElementById('noUrut')
    const namaSiswa = document.getElementById('namaSiswa');
    const kelas = document.getElementById('kelas');
    const nilai = document.getElementById('score');
    const search = document.getElementById('search');
    const nilaiRata2 = document.getElementById('nilaiRata2');

   const siswa = [
        { name: "megachan", 
          class: "A", 
          score: 93 },

        { name: "Jokowi",
          class: "C", 
          score: 89 },

        { name: "syifa", 
          class: "B", 
          score: 80 },

        { name: "marcel", 
          class: "C", 
          score: 88 },

        { name: "orinta", 
          class: "B", 
          score: 78 },

        { name: "aureliyu", 
          class: "A", 
          score: 85 },

        { name: "Rizky", 
          class: "B", 
          score: 100 },

        { name: "Prabowo",
          class: "C", 
          score: 73 },

        { name: "Hafiz", 
          class: "B",
          score: 96 },

        { name: "Bahlil",
          class: "E", 
          score: 0 }
    ];

function renderData(dataSiswa) {
    let tampilanData = '';
    
    dataSiswa.forEach((item, index) => {
        tampilanData += `
        <tr>
            <td class="judultable">${index + 1}</td>
            <td class="namasiswa">${item.name}</td>
            <td class="judultable">${item.class}</td>
            <td class="judultable">${item.score}</td>
        </tr>`;
    });
    
    kontainerData.innerHTML = tampilanData;

    if (dataSiswa.length > 0) {
        const totalScore = dataSiswa.reduce((total, item) => total + item.score, 0);
        const averageScore = totalScore / dataSiswa.length;

        nilaiRata2.innerHTML = `<h4>Rata-rata Nilai: ${averageScore.toFixed(2)}</h4>`;
    } else {
        nilaiRata2.innerHTML = `<h4>Rata-rata Nilai: 0</h4>`;
    }
}


search.addEventListener('input', function(event) {
    const kataKunci = event.target.value.toLowerCase();

    const filteredSiswa = siswa.filter(item => {

        return item.name.toLowerCase().includes(kataKunci);
    });

    renderData(filteredSiswa);

    
});
renderData(siswa);

 </script>
